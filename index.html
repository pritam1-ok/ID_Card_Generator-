<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HH Goa 2026 - Generator Workspace</title>
  
  <!-- Free CDNs for Frameworks and Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/heic2any"></script>
  
  <!-- Free Google Font for Human Handwriting -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
  
  <style>
    .bg-grid {
      background-size: 40px 40px;
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-[#03150b] text-neutral-200 flex flex-col md:flex-row font-sans selection:bg-[#EC4899] selection:text-white">

  <!-- Left Sidebar Controls -->
  <aside class="w-full md:w-[400px] h-full bg-[#051c0e] border-r border-white/10 flex flex-col z-10 flex-shrink-0">
    <div class="p-6 border-b border-white/10">
      <h1 class="text-2xl font-black text-[#FDE047] tracking-tight uppercase">HH Goa 2026</h1>
      <p class="text-xs text-neutral-400 mt-1 uppercase tracking-widest font-semibold">Badge Generator v6</p>
    </div>

    <div class="p-6 flex-1 flex flex-col gap-6 overflow-y-auto">
      <div class="bg-black/50 p-1 rounded-lg flex gap-1 border border-white/5">
        <button id="btnFormatA" onclick="setFormat('A')" class="flex-1 py-2 rounded font-bold text-sm bg-[#FDE047] text-[#0B4627] shadow transition-colors">Frame (A)</button>
        <button id="btnFormatB" onclick="setFormat('B')" class="flex-1 py-2 rounded font-bold text-sm text-neutral-400 hover:text-white transition-colors">ID Card (B)</button>
      </div>

      <div>
        <label class="block text-xs uppercase tracking-widest text-neutral-500 font-bold mb-2">Source Image</label>
        <button onclick="document.getElementById('upload').click()" class="w-full flex items-center justify-center gap-2 border border-dashed border-[#FDE047]/30 bg-[#FDE047]/5 hover:bg-[#FDE047]/10 text-[#FDE047] py-4 rounded-lg font-semibold text-sm transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
          <span id="dropText">Upload Photo (JPG/PNG/HEIC)</span>
        </button>
        <input type="file" id="upload" accept="image/jpeg, image/png, image/heic, .heic" onchange="handleFileSelect(event)" class="hidden">
      </div>

      <div id="formatB-fields" class="space-y-4 hidden">
        <div>
          <label class="block text-xs uppercase tracking-widest text-neutral-500 font-bold mb-2">Identity Details</label>
          <div class="space-y-3">
            <input type="text" id="name" placeholder="YOUR NAME" oninput="drawCanvas()" class="w-full bg-black/40 border border-white/10 text-white placeholder-neutral-600 px-3 py-2.5 rounded-lg focus:border-[#FDE047] outline-none font-bold uppercase text-sm">
            <input type="text" id="role" placeholder="ROLE / STACK" oninput="drawCanvas()" class="w-full bg-black/40 border border-white/10 text-white placeholder-neutral-600 px-3 py-2.5 rounded-lg focus:border-[#FDE047] outline-none font-bold uppercase text-sm">
            <input type="text" id="title" placeholder="ID: 123 456 789" oninput="drawCanvas()" class="w-full bg-black/40 border border-white/10 text-white placeholder-neutral-600 px-3 py-2.5 rounded-lg focus:border-[#FDE047] outline-none font-bold uppercase text-sm">
          </div>
        </div>
      </div>
    </div>

    <div class="p-6 border-t border-white/10 bg-[#051c0e] flex gap-3">
      <button onclick="downloadImage()" class="flex-1 bg-[#FDE047] hover:bg-yellow-400 text-[#0B4627] font-bold py-2.5 rounded-lg text-sm transition-colors">Export PNG</button>
      <button onclick="shareToX()" class="flex-1 bg-neutral-900 hover:bg-black text-white border border-neutral-700 font-bold py-2.5 rounded-lg text-sm transition-colors">Share to X</button>
    </div>
  </aside>

  <!-- Right Main Area Preview -->
  <main class="flex-1 h-full bg-[#03150b] bg-grid flex flex-col relative overflow-hidden">
    <div class="absolute top-0 w-full h-1 bg-gradient-to-r from-[#0B4627] via-[#FDE047] to-[#EC4899]"></div>
    
    <div class="flex-1 w-full h-full p-8 flex items-center justify-center relative">
      <div id="placeholderText" class="text-neutral-600 flex flex-col items-center gap-2">
        <svg class="w-8 h-8 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        <span class="text-sm font-semibold tracking-widest uppercase">Awaiting Image Input</span>
      </div>
      <canvas id="canvas" class="hidden max-w-full max-h-full object-contain drop-shadow-2xl rounded shadow-[0_0_50px_rgba(0,0,0,0.5)]"></canvas>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const dropText = document.getElementById('dropText');
    let currentFormat = 'A'; 
    let userImage = null;

    const COLORS = { bg: '#0B4627', gold: '#FDE047', pink: '#EC4899', white: '#FFFFFF' };

    function setFormat(format) {
      currentFormat = format;
      document.getElementById('formatB-fields').style.display = format === 'B' ? 'block' : 'none';
      
      const activeClass = "flex-1 py-2 rounded font-bold text-sm bg-[#FDE047] text-[#0B4627] shadow transition-colors";
      const inactiveClass = "flex-1 py-2 rounded font-bold text-sm text-neutral-400 hover:text-white transition-colors";
      
      document.getElementById('btnFormatA').className = format === 'A' ? activeClass : inactiveClass;
      document.getElementById('btnFormatB').className = format === 'B' ? activeClass : inactiveClass;
      drawCanvas();
    }

    function handleFileSelect(e) {
      if (e.target.files.length) processFile(e.target.files[0]);
    }

    async function processFile(file) {
      let blob = file;
      if (file.name.toLowerCase().endsWith('.heic') || file.type === 'image/heic') {
        dropText.innerText = "Converting HEIC...";
        try { blob = await heic2any({ blob: file, toType: 'image/jpeg' }); } 
        catch (err) { return alert("HEIC conversion failed."); }
        finally { dropText.innerText = "Upload Photo (JPG/PNG/HEIC)"; }
      }
      
      const img = new Image();
      img.onload = () => {
        userImage = img;
        canvas.classList.remove('hidden');
        document.getElementById('placeholderText').classList.add('hidden');
        dropText.innerText = "Change Image";
        drawCanvas();
      };
      img.src = URL.createObjectURL(blob);
    }

    // Wavy Border algorithm
    function drawWavyRect(x, y, width, height, amplitude, frequency, color, lineWidth) {
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.beginPath();
      
      for (let i = 0; i <= width; i += 5) { ctx.lineTo(x + i, y - Math.sin(i * frequency) * amplitude); }
      for (let i = 0; i <= height; i += 5) { ctx.lineTo(x + width + Math.sin(i * frequency) * amplitude, y + i); }
      for (let i = width; i >= 0; i -= 5) { ctx.lineTo(x + i, y + height + Math.sin(i * frequency) * amplitude); }
      for (let i = height; i >= 0; i -= 5) { ctx.lineTo(x - Math.sin(i * frequency) * amplitude, y + i); }
      
      ctx.closePath();
      ctx.stroke();
    }

    // Helper functions for Format B
    function drawCross(x, y, size, color) {
      ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.beginPath();
      ctx.moveTo(x - size, y); ctx.lineTo(x + size, y);
      ctx.moveTo(x, y - size); ctx.lineTo(x, y + size); ctx.stroke();
    }
    function drawWaves(yOffset, color) {
      ctx.strokeStyle = color; ctx.lineWidth = 2;
      for (let i = 0; i < 5; i++) {
        ctx.beginPath(); ctx.moveTo(0, yOffset + (i * 20));
        ctx.bezierCurveTo(300, yOffset - 100 + (i * 20), 700, yOffset + 200 + (i * 20), 1080, yOffset + (i * 20));
        ctx.stroke();
      }
    }
    function fillTextAutoFit(ctx, text, x, y, maxWidth, maxFontSize, fontModifiers = "bold") {
      let fontSize = maxFontSize;
      ctx.font = `${fontModifiers} ${fontSize}px sans-serif`;
      while (ctx.measureText(text).width > maxWidth && fontSize > 20) {
        fontSize -= 2;
        ctx.font = `${fontModifiers} ${fontSize}px sans-serif`;
      }
      ctx.fillText(text, x, y);
    }

    function drawCanvas() {
      if (!userImage) return;
      
      canvas.width = currentFormat === 'A' ? 1080 : 960; 
      canvas.height = currentFormat === 'A' ? 1080 : 1712; 
      
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      if (currentFormat === 'A') {
        // --- FORMAT A (STRICTLY NO-OVERLAP) ---
        ctx.fillStyle = COLORS.bg; 
        ctx.fillRect(0, 0, w, h);

        const margin = 160; 
        const photoSize = w - (margin * 2); 
        const offset = margin;
        
        const scale = Math.max(photoSize / userImage.width, photoSize / userImage.height);
        const sw = userImage.width * scale, sh = userImage.height * scale;
        
        ctx.save();
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(offset, offset, photoSize, photoSize, 40);
        else ctx.rect(offset, offset, photoSize, photoSize);
        ctx.clip();
        ctx.drawImage(userImage, offset + (photoSize - sw) / 2, offset + (photoSize - sh) / 2, sw, sh);
        ctx.restore();

        const wavePadding = 25;
        const waveX = offset - wavePadding;
        const waveY = offset - wavePadding;
        const waveSize = photoSize + (wavePadding * 2);

        drawWavyRect(waveX, waveY, waveSize, waveSize, 12, 0.04, COLORS.gold, 6);
        drawWavyRect(waveX - 12, waveY - 12, waveSize + 24, waveSize + 24, 8, 0.05, COLORS.pink, 3);

        // --- HANDWRITTEN AI TERMS ---
        ctx.fillStyle = 'rgba(255, 255, 255, 0.6)'; // Increased opacity for better readability
        
        // Utilizing the newly imported 'Caveat' handwriting font
        ctx.font = '600 36px "Caveat", cursive'; 
        
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Top Edge Margin
        ctx.fillText("LLM", w / 2, margin / 2);
        ctx.fillText("Transformer", w / 4 + 20, margin / 2);
        ctx.fillText("Neural Net", (w / 4) * 3 - 20, margin / 2);

        // Left Edge Margin (Rotated perfectly vertical)
        ctx.save();
        ctx.translate(margin / 2, h / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.fillText("Gradient", 0, 0);
        ctx.fillText("Backpropagation", -220, 0);
        ctx.fillText("Attention", 220, 0);
        ctx.restore();

        // Right Edge Margin (Rotated perfectly vertical)
        ctx.save();
        ctx.translate(w - (margin / 2), h / 2);
        ctx.rotate(Math.PI / 2);
        ctx.fillText("Tensors", 0, 0);
        ctx.fillText("Epoch", -220, 0);
        ctx.fillText("Generative", 220, 0);
        ctx.restore();

        // --- MAIN BRANDING ---
        ctx.textBaseline = 'alphabetic'; 
        
        ctx.fillStyle = COLORS.gold; 
        ctx.font = 'bold 60px serif'; 
        ctx.fillText('HACKER HOUSE', w / 2, h - 70); 

        ctx.fillStyle = COLORS.pink; 
        ctx.font = 'bold 30px sans-serif'; 
        ctx.fillText('GOA, INDIA', w / 2, h - 30); 

      } else {
        // --- ID CARD FORMAT B ---
        ctx.fillStyle = COLORS.bg; ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = COLORS.gold; ctx.lineWidth = 15; ctx.strokeRect(40, 40, w - 80, h - 80);
        ctx.strokeStyle = COLORS.pink; ctx.lineWidth = 4; ctx.strokeRect(60, 60, w - 120, h - 120);

        drawWaves(200, 'rgba(253, 224, 71, 0.2)'); drawWaves(1200, 'rgba(253, 224, 71, 0.2)');
        
        ctx.fillStyle = COLORS.pink;
        ctx.beginPath(); ctx.arc(150, 250, 20, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(800, 1250, 30, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = COLORS.gold;
        ctx.beginPath(); ctx.arc(750, 180, 15, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(200, 1300, 25, 0, Math.PI * 2); ctx.fill();

        drawCross(800, 350, 20, COLORS.white); drawCross(200, 1100, 20, COLORS.white);

        const photoSize = 400, photoX = (w - photoSize) / 2, photoY = 220;
        ctx.fillStyle = COLORS.pink; ctx.fillRect(photoX + 20, photoY + 20, photoSize, photoSize);
        
        const scale = Math.max(photoSize / userImage.width, photoSize / userImage.height);
        const sw = userImage.width * scale, sh = userImage.height * scale;
        
        ctx.save();
        ctx.beginPath(); ctx.rect(photoX, photoY, photoSize, photoSize); ctx.clip();
        ctx.drawImage(userImage, photoX + (photoSize - sw) / 2, photoY + (photoSize - sh) / 2, sw, sh);
        ctx.restore();

        ctx.strokeStyle = COLORS.gold; ctx.lineWidth = 10; ctx.strokeRect(photoX, photoY, photoSize, photoSize);

        const name = (document.getElementById('name').value || 'YOUR NAME').toUpperCase();
        const role = (document.getElementById('role').value || 'ROLE / STACK').toUpperCase();
        const title = (document.getElementById('title').value || 'ID: 123 456 789').toUpperCase();

        ctx.textAlign = 'center';
        const maxTextWidth = w - 160; 

        ctx.fillStyle = COLORS.white; fillTextAutoFit(ctx, name, w / 2, photoY + photoSize + 110, maxTextWidth, 70, "bold");
        ctx.fillStyle = COLORS.gold; fillTextAutoFit(ctx, role, w / 2, photoY + photoSize + 170, maxTextWidth, 40, "bold");
        ctx.fillStyle = COLORS.pink; fillTextAutoFit(ctx, title, w / 2, photoY + photoSize + 220, maxTextWidth, 30, "bold");

        ctx.strokeStyle = COLORS.white; ctx.lineWidth = 2; ctx.beginPath();
        ctx.moveTo(w/2 - 150, photoY + photoSize + 270); ctx.lineTo(w/2 + 150, photoY + photoSize + 270); ctx.stroke();

        ctx.fillStyle = COLORS.gold; ctx.font = '40px sans-serif'; ctx.fillText('GOA, INDIA', w / 2, h - 350);
        ctx.font = 'bold 120px serif'; ctx.fillText('HACKER', w / 2, h - 230); ctx.fillText('HOUSE', w / 2, h - 130);
        ctx.fillStyle = COLORS.pink; ctx.font = 'bold 90px sans-serif'; ctx.fillText('गोवा', w / 2, h - 180);
        ctx.fillStyle = COLORS.gold; ctx.font = '35px sans-serif'; ctx.fillText('28 - 31 OCT 2026', w / 2, h - 60);
      }
    }

    function downloadImage() {
      if (!userImage) return alert("Upload a photo first.");
      const link = document.createElement('a');
      link.download = currentFormat === 'A' ? 'HH_Goa_Frame.png' : 'HH_Goa_ID_Card.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function shareToX() {
      if (!userImage) return alert("Upload a photo first.");
      const text = encodeURIComponent("Ready for HH Goa 2026! #FrameInGoa");
      window.open(`https://x.com/intent/tweet?text=${text}`, '_blank');
    }

    // IMPORTANT: Wait for the Google Font to load before drawing to ensure it renders correctly
    document.fonts.ready.then(() => {
      drawCanvas();
    });
  </script>
</body>
</html>
